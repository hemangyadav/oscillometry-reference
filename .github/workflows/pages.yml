# Runs the golden tests on every push to main and deploys to GitHub Pages
# only if they pass. Settings > Pages > Source must be "GitHub Actions".
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Golden cases (pred, LLN, ULN, z to 1e-8)
        run: node tests/run_golden.js
      - name: Behaviour checks
        run: node tests/run_checks.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site (page, engine, coefficients only)
        run: |
          mkdir -p _site/js
          cp index.html coefficients.json _site/
          cp js/refeq.js _site/js/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
